stages:
  - build-prod
  - build-test
  - deploy-prod
  - deploy-test

variables:
  COMPOSE_PROJECT: "mcm-api-prod"
  COMPOSE_PROJECT_T: "mcm-api-test"
  IMAGE_NAME_API: "mcm-api"

build_prod:
  stage: build-prod
  tags:
    - runner-build
  image: docker:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    # - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+$/'
  services:
    - name: docker:dind
      alias: docker
      command: ["--insecure-registry", "harbor.allforone.mg"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
  before_script:
    - docker login "$HARBOR_URL" -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD"
    - echo "Login Harbor réussi ✅"
  script:
    - export TAG=${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}
    - export FULL_IMAGE_NAME="$HARBOR_URL/$HARBOR_PROJECT_API/$IMAGE_NAME_API:$TAG"
    - echo "🚀 Build de l'image $FULL_IMAGE_NAME ..."
    - docker system prune -af --volumes
    - docker build -t "$FULL_IMAGE_NAME" .
    - echo "⬆️  Push vers Harbor..."
    - docker push "$FULL_IMAGE_NAME"

build_test:
  stage: build-test
  tags:
    - runner-test
  image: docker:latest
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  services:
    - name: docker:dind
      alias: docker
      command: ["--insecure-registry", "harbor.allforone.mg"]
  variables:
    DOCKER_TLS_CERTDIR: ""
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
  before_script:
    - docker login "$HARBOR_URL" -u "$REGISTRY_USER" -p "$REGISTRY_PASSWORD"
  script:
    - export FULL_IMAGE_NAME="$HARBOR_URL/$HARBOR_PROJECT_API/$IMAGE_NAME_API:$CI_COMMIT_SHORT_SHA"
    - echo "🚀 Build de l'image $FULL_IMAGE_NAME ..."
    - docker system prune -af --volumes
    - docker build -t "$FULL_IMAGE_NAME" .
    - echo "⬆️  Push vers Harbor..."
    - docker push "$FULL_IMAGE_NAME"

deploy_prod:
  stage: deploy-prod
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    # - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+$/'
  trigger:
    # project: allforone/infra-deploy
    # branch: main
    project: Michael/infra-depl
    branch: init-infra
    strategy: depend
  inherit:
    variables:
      - COMPOSE_PROJECT
  variables:
    # IMAGE_TAG_API: $CI_COMMIT_SHORT_SHA       # ← variable API, pas FRONT
    PROJECT_NAME: "mcm-api"
    CI_COMMIT_SHA_SHORT: $CI_COMMIT_SHORT_SHA
    ENVIRONMENT: "test"

deploy_test:
  stage: deploy-test
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
  trigger:
    # project: allforone/infra-deploy
    # branch: main
    # test compte michael
    project: Michael/infra-depl
    branch: init-infra
    strategy: depend
  variables:
    PROJECT_NAME: "mcm-api"
    CI_COMMIT_SHA_SHORT: $CI_COMMIT_SHORT_SHA
    ENVIRONMENT: "test"
